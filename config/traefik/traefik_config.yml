accessLog:
  bufferingSize: 100
  fields:
    defaultMode: drop
    headers:
      defaultMode: drop
      names:
        Authorization: redact
        Content-Type: keep
        Cookie: redact
        User-Agent: keep
        X-Forwarded-For: keep
        X-Forwarded-Proto: keep
        X-Real-Ip: keep
    names:
      ClientAddr: keep
      ClientHost: keep
      DownstreamContentSize: keep
      DownstreamStatus: keep
      Duration: keep
      RequestMethod: keep
      RequestPath: keep
      RequestProtocol: keep
      RetryAttempts: keep
      ServiceName: keep
      StartUTC: keep
      TLSCipher: keep
      TLSVersion: keep
  filePath: /var/log/traefik/access.log
  filters:
    minDuration: 100ms
    retryAttempts: true
    statusCodes:
      - 200-299
      - 400-499
      - 500-599
  format: json
api:
  dashboard: true
  insecure: true
certificatesResolvers:
  letsencrypt:
    acme:
      caServer: https://acme-v02.api.letsencrypt.org/directory
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      dnsChallenge:
        delayBeforeCheck: 90
        provider: "cloudflare"
      email: "brian@fedinerds.net"
      #httpChallenge:
      #  entryPoint: web
      storage: /letsencrypt/acme.json
entryPoints:
  web:
    address: :80
  websecure:
    address: :443
    http:
      encodedCharacters:
        allowEncodedQuestionMark: true
        allowEncodedSlash: true
      middlewares:
        - crowdsec@file
      tls:
        certResolver: letsencrypt
    transport:
      respondingTimeouts:
        readTimeout: 30m
  tcp-22:
    address: ":22/tcp"
experimental:
  plugins:
    badger:
      moduleName: github.com/fosrl/badger
      version: v1.3.1
    crowdsec:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.4
log:
  compress: true
  format: json
  level: INFO
  filePath: /var/log/traefik/traefik.log
  maxAge: 3
  maxBackups: 3
  maxSize: 100
ping:
  entryPoint: web
providers:
  file:
    directory: "/rules"
    watch: true
    #filename: /etc/traefik/dynamic_config.yml
  http:
    # endpoint: http://pangolin:3001/api/v1/traefik-config
    endpoint: http://middleware-manager:3456/api/v1/traefik-config
    pollInterval: 5s
serversTransport:
  insecureSkipVerify: true
